# -- settle-graft (priority 10) ------------------------------------------
#
# Only the core register / verify / note are bound. The convenience
# builders for schnorr / ed25519 / membership / bounded / manifest gates
# take types from nockchain-types that aren't re-exported from
# vesl-core; binding them would force a new dep on vesl-test. Use
# `poke_slab(build_settle_note_schnorr_poke(...))` for those.

[[graft]]
name = "settle"

[[graft.pokes]]
tag     = "settle-register"
method  = "settle_register"
builder = "build_settle_register_poke"
args    = [
    { name = "hull", rust = "u64"        },
    { name = "root", rust = "&Tip5Hash"  },
]

[[graft.pokes]]
tag     = "settle-verify"
method  = "settle_verify"
builder = "build_settle_verify_poke"
args    = [
    { name = "note_id", rust = "u64"        },
    { name = "hull",    rust = "u64"        },
    { name = "root",    rust = "&Tip5Hash"  },
    { name = "data",    rust = "&[u8]"      },
]

[[graft.pokes]]
tag     = "settle-note"
method  = "settle_note"
builder = "build_settle_note_poke"
args    = [
    { name = "note_id", rust = "u64"        },
    { name = "hull",    rust = "u64"        },
    { name = "root",    rust = "&Tip5Hash"  },
    { name = "data",    rust = "&[u8]"      },
]

[[graft.errors]]
tag = "settle-error"

# [%settle-register-rejected hull=@ existing-root=@] — typed kernel
# rejection when a hull is already registered with a different root.
# `existing_root` is the registered Tip5 hash; decoded as raw bytes for
# now (the @ may exceed Tip5Hash's 5-felt layout in pathological cases).
[[graft.rejected]]
tag    = "settle-register-rejected"
fields = [
    { name = "hull",          rust = "u64"     },
    { name = "existing_root", rust = "Vec<u8>" },
]

# [%settle-denied reason=@t] — gate-clean-deny. The verify gate returned
# `%.n` and the kernel emitted a typed denied effect with the human-
# readable reason cord.
[[graft.denied]]
tag = "settle-denied"

# -- validate-graft (priority 120) ---------------------------------------

[[graft]]
name = "validate"

[[graft.pokes]]
tag     = "validate-init"
method  = "validate_init"
builder = "build_validate_init_poke"
args    = [
    { name = "cause_tag", rust = "&str"          },
    { name = "rules",     rust = "&[ValidateRule]" },
]

[[graft.pokes]]
tag     = "validate-clear"
method  = "validate_clear"
builder = "build_validate_clear_poke"
args    = [{ name = "cause_tag", rust = "&str" }]

[[graft.errors]]
tag = "validate-error"

# [%validate-rejected cause-tag=@ta reason=@t] — validate-graft's
# poke-prelude short-circuits a downstream cause whose validation rules
# failed; the rejected effect carries the cause-tag that was blocked
# and a free-text reason cord.
[[graft.rejected]]
tag    = "validate-rejected"
fields = [
    { name = "cause_tag", rust = "String" },
    { name = "reason",    rust = "String" },
]
