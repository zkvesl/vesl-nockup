# harness-bindings.toml — sidecar metadata for `nockup-graft codegen
# harness-methods`. Declares the Rust signature of every shipped poke
# arm so the codegen can emit typed methods on `GraftTestHarness`, plus
# the per-graft error / rejected / denied effect shapes so the codegen
# can emit typed outcome enums.
#
# Scope: vesl-nockup-only sidecar (not in vesl-core's canonical
# manifests). Eliminates cross-repo coupling for the first cut of
# manifest-driven Rust codegen — see .dev/vesl-nockup-v2.0.md for the
# planned migration into the per-graft `*-graft.toml` files.
#
# Schema per graft block:
#
#   [[graft]]
#   name = "<graft>"            # base name without "-graft" suffix
#
#   [[graft.pokes]]
#   tag     = "<cause-tag>"     # the %<cause-tag> the kernel accepts;
#                               # asserted via assert_kernel_cause_tag!
#   method  = "<snake_case>"    # method name on GraftTestHarness
#   builder = "build_<...>_poke" # function in vesl_core:: to delegate to
#   args    = [{ name = "<n>", rust = "<rust-type>" }, ...]
#                               # arg names + Rust types as text;
#                               # substituted into the method signature
#                               # and forwarded positionally to the
#                               # builder
#
#   [[graft.errors]]            # [%<graft>-error msg=@t] effects
#   tag = "<graft>-error"
#
#   [[graft.rejected]]          # typed rejection effects beyond the
#                               # generic %<graft>-error cord
#   tag    = "<graft>-...-rejected"
#   fields = [{ name = "<n>", rust = "<rust-type>", decode = "<helper>" }, ...]
#
#   [[graft.denied]]            # %<graft>-denied reason=@t effects
#   tag = "<graft>-denied"
#
# Excluded from this sidecar:
#   - intent-graft  — placeholder; every arm crashes with
#                     %intent-graft-placeholder, no point in generating
#                     typed methods that always return Crashed.
#   - settle convenience builders (schnorr / ed25519 / membership /
#                     bounded / manifest) — take types from
#                     nockchain-types that aren't re-exported through
#                     vesl-core, would add a new dep to vesl-test.
#                     The `poke_slab(build_..._poke(...))` escape hatch
#                     stays available.
#   - Deprecated `build_vesl_*_poke` aliases — already shimmed.
#   - Closure-based `*_poke_with_data` variants — generic callers,
#                     don't fit the typed-args codegen shape.

schema_version = 1

# -- batch-graft (priority 130) -------------------------------------------

[[graft]]
name = "batch"

[[graft.pokes]]
tag     = "batch-init"
method  = "batch_init"
builder = "build_batch_init_poke"
args    = [{ name = "threshold", rust = "u64" }]

[[graft.pokes]]
tag     = "batch-add"
method  = "batch_add"
builder = "build_batch_add_poke"
args    = [{ name = "intent_jammed", rust = "&[u8]" }]

[[graft.pokes]]
tag     = "batch-add"
method  = "batch_add_from_noun"
builder = "build_batch_add_poke_from_noun"
args    = [{ name = "payload", rust = "&NounSlab" }]

[[graft.pokes]]
tag     = "batch-flush"
method  = "batch_flush"
builder = "build_batch_flush_poke"
args    = []

[[graft.errors]]
tag = "batch-error"

