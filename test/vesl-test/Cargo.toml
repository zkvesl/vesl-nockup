[package]
name = "vesl-test"
version = "0.1.0"
edition = "2024"
description = "Test harness for grafted NockApp kernels — boot, poke, assert effects"
license = "MIT OR Apache-2.0"

[dependencies]
# vesl-core crates live inside vesl-nockup/crates/ (bundled copy synced
# from upstream by sync.sh). Tip5Hash + tip5_to_atom_le_bytes flow through
# vesl-core's re-exports — no direct nockchain-tip5-rs dep needed.
vesl-core    = { path = "../../crates/vesl-core" }
nock-noun-rs = { path = "../../crates/nock-noun-rs" }

# nockchain monorepo crates: must use the same source as vesl-core's
# transitive deps or we get duplicate `nockvm`/`nockapp` versions in the
# graph and `nock_noun_rs::Noun` stops type-equating to `nockapp::Noun`.
# vesl-core uses path = "../../../nockchain/crates/...", so we mirror.
#
# slog-tracing routes Hoon `~> %slog.[pri text]` through tracing macros
# (priority 1 → warn, priority 0 → info, etc.) so PokeReport's capture
# layer can scoop them. Without this feature the slogs go straight to
# stderr and our Layer never sees them.
nockapp        = { path = "../../../nockchain/crates/nockapp", default-features = false, features = ["slog-tracing"] }
nockvm         = { path = "../../../nockchain/crates/nockvm/rust/nockvm" }
nockvm_macros  = { path = "../../../nockchain/crates/nockvm/rust/nockvm_macros" }

anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
