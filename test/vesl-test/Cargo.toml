[package]
name = "vesl-test"
version = "0.1.0"
edition = "2024"
description = "Test harness for grafted NockApp kernels — boot, poke, assert effects"
license = "MIT"

[dependencies]
# Phase 6.5b: consume vesl-core (and transitively nock-noun-rs etc.) from
# the upstream vesl-core repo, not from local mirrors. Path dep during
# development; switches to a git dep on the published vesl-core branch at
# plan merge (per .dev/00_PARAMETIZATION.md §"Merge order"):
#   vesl-core    = { git = "https://github.com/zkvesl/vesl-core", branch = "dev" }
#   nock-noun-rs = { git = "https://github.com/zkvesl/vesl-core", branch = "dev" }
# Tip5Hash + tip5_to_atom_le_bytes flow through vesl-core's re-exports —
# no direct nockchain-tip5-rs dep needed.
vesl-core    = { path = "../../../vesl-core/crates/vesl-core" }
nock-noun-rs = { path = "../../../vesl-core/crates/nock-noun-rs" }

# nockchain monorepo crates: must use the same source as vesl-core's
# transitive deps or we get duplicate `nockvm`/`nockapp` versions in the
# graph and `nock_noun_rs::Noun` stops type-equating to `nockapp::Noun`.
# vesl-core uses path = "../../../nockchain/crates/...", so we mirror.
nockapp        = { path = "../../../nockchain/crates/nockapp", default-features = false }
nockvm         = { path = "../../../nockchain/crates/nockvm/rust/nockvm" }
nockvm_macros  = { path = "../../../nockchain/crates/nockvm/rust/nockvm_macros" }

anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
