[workspace]
resolver = "2"
# vesl-nockup no longer mirrors the vesl crate stack. vesl-core /
# nock-noun-rs / nockchain-tip5-rs / nockchain-client-rs are consumed
# from the upstream vesl-core repo via path/git dep; the local
# `crates/` directory is gone. Only first-party tools and test harness
# live here.
members = [
    "tools/graft-inject",
    "test/vesl-test",
]

# vesl-core pulls nockchain crates as git deps at rev a19f8017... .
# Workspace members below also path-dep a handful of nockchain crates.
# Without this patch, cargo sees git and path as distinct sources and
# the type graph splits, breaking NounAllocator trait impls across
# crate boundaries. Redirect git → local path so there's one copy.
[patch."https://github.com/nockchain/nockchain.git"]
nockapp         = { path = "../nockchain/crates/nockapp" }
nockvm          = { path = "../nockchain/crates/nockvm/rust/nockvm" }
nockvm_macros   = { path = "../nockchain/crates/nockvm/rust/nockvm_macros" }
ibig            = { path = "../nockchain/crates/nockvm/rust/ibig" }
nockchain-math  = { path = "../nockchain/crates/nockchain-math" }
nockchain-types = { path = "../nockchain/crates/nockchain-types" }
noun-serde      = { path = "../nockchain/crates/noun-serde" }
