[workspace]
resolver = "2"
# vesl-nockup is self-contained post-sync: the vesl-core crate stack
# (vesl-core, nock-noun-rs, nockchain-tip5-rs, nockchain-client-rs) lives
# under crates/ as a bundled copy refreshed by sync.sh. Workspace members
# (tools/, test/) path-dep into that local crates/ directory; nockchain
# is the only legitimate external sibling. Templates are independent
# projects under templates/, not workspace members.
members = [
    "tools/graft-inject",
    "test/vesl-test",
]

# Workspace members path-dep a handful of nockchain crates, and the bundled
# vesl-core in crates/ path-deps the rest. Any stale git-dep references
# to nockchain.git that slip in get redirected here so the type graph
# stays single (NounAllocator trait impls must share one nockvm source).
[patch."https://github.com/nockchain/nockchain.git"]
nockapp         = { path = "../nockchain/crates/nockapp" }
nockvm          = { path = "../nockchain/crates/nockvm/rust/nockvm" }
nockvm_macros   = { path = "../nockchain/crates/nockvm/rust/nockvm_macros" }
ibig            = { path = "../nockchain/crates/nockvm/rust/ibig" }
nockchain-math  = { path = "../nockchain/crates/nockchain-math" }
nockchain-types = { path = "../nockchain/crates/nockchain-types" }
noun-serde      = { path = "../nockchain/crates/noun-serde" }
