[package]
name = "vesl-core"
version = "0.1.0"
edition = "2024"
description = "High-level Vesl SDK — Mint/Guard/Settle/Forge facades over the extracted crate stack"
license = "MIT"

[dependencies]
# Sibling extracted crates
nockchain-tip5-rs = { path = "../nockchain-tip5-rs", features = ["serde"] }
nock-noun-rs = { path = "../nock-noun-rs" }
nockchain-client-rs = { path = "../nockchain-client-rs" }

# Nockchain monorepo crates
nockapp = { git = "https://github.com/nockchain/nockchain.git", default-features = false }
nockvm = { git = "https://github.com/nockchain/nockchain.git" }
nockchain-math = { git = "https://github.com/nockchain/nockchain.git" }
nockchain-types = { git = "https://github.com/nockchain/nockchain.git" }
noun-serde = { git = "https://github.com/nockchain/nockchain.git" }
nockvm_macros = { git = "https://github.com/nockchain/nockchain.git" }
ibig = { git = "https://github.com/nockchain/nockchain.git", package = "ibig" }

# Standard deps
anyhow = "1.0"
bytes = "1"
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = []
clap = ["dep:clap"]
