[package]
name = "nockchain-client-rs"
version = "0.1.0"
edition = "2024"
description = "Nockchain gRPC client — chain queries, wallet coordination, NoteData encoding for NockApp developers"
license = "MIT"

[dependencies]
# Nockchain monorepo crates
nockvm = { git = "https://github.com/nockchain/nockchain.git" }
nockapp = { git = "https://github.com/nockchain/nockchain.git", default-features = false }
nockapp-grpc = { git = "https://github.com/nockchain/nockchain.git" }
nockchain-types = { git = "https://github.com/nockchain/nockchain.git" }
noun-serde = { git = "https://github.com/nockchain/nockchain.git" }

# Vesl extracted crates
nockchain-tip5-rs = { path = "../nockchain-tip5-rs" }

# Standard deps
anyhow = "1.0"
tokio = { version = "1", features = ["time"] }
