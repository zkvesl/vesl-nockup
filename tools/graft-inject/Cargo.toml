[package]
name = "graft-inject"
version = "0.1.0"
edition = "2021"
description = "Inject Vesl graft wiring into a nockup app.hoon kernel"
license = "MIT"

[[bin]]
name = "graft-inject"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
# Integration tests (mint_lifecycle etc.) boot a graft-composed kernel
# and drive it via vesl-test's harness. Path deps mirror
# test/vesl-test/Cargo.toml so the nockapp/nockvm graph stays single.
vesl-core    = { path = "../../../vesl-core/crates/vesl-core" }
vesl-test    = { path = "../../test/vesl-test" }
nock-noun-rs = { path = "../../../vesl-core/crates/nock-noun-rs" }
nockapp      = { path = "../../../nockchain/crates/nockapp", default-features = false }
nockvm       = { path = "../../../nockchain/crates/nockvm/rust/nockvm" }
tokio        = { version = "1", features = ["rt-multi-thread", "macros"] }
