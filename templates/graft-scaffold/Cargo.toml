# ci: skip-template-check (path-deps require user fixup)
[package]
name = "my-nockapp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "my-nockapp"
path = "src/main.rs"

[dependencies]
# NockVM — adjust paths to your nockchain clone
nockapp = { git = "https://github.com/nockchain/nockchain.git", rev = "73877be29bd1fafeeade1be7b95aebb0f64d8382", default-features = false }
nockvm = { git = "https://github.com/nockchain/nockchain.git", rev = "73877be29bd1fafeeade1be7b95aebb0f64d8382" }
nockvm_macros = { git = "https://github.com/nockchain/nockchain.git", rev = "73877be29bd1fafeeade1be7b95aebb0f64d8382" }
zkvm-jetpack = { git = "https://github.com/nockchain/nockchain.git", rev = "73877be29bd1fafeeade1be7b95aebb0f64d8382" }

# Vesl SDK — adjust paths to your vesl clone
vesl-core = { path = "../../crates/vesl-core" }
nock-noun-rs = { path = "../../crates/nock-noun-rs" }
nockchain-tip5-rs = { path = "../../crates/nockchain-tip5-rs" }

tokio = { version = "1.32", features = ["rt-multi-thread", "macros"] }
sha2 = "0.10"

[patch."https://github.com/nockchain/nockchain.git"]
nockapp         = { path = "../../../nockchain/crates/nockapp" }
nockvm          = { path = "../../../nockchain/crates/nockvm/rust/nockvm" }
nockvm_macros   = { path = "../../../nockchain/crates/nockvm/rust/nockvm_macros" }
ibig            = { path = "../../../nockchain/crates/nockvm/rust/ibig" }
nockchain-math  = { path = "../../../nockchain/crates/nockchain-math" }
nockchain-types = { path = "../../../nockchain/crates/nockchain-types" }
noun-serde      = { path = "../../../nockchain/crates/noun-serde" }
