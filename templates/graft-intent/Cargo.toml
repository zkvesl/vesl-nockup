[package]
name = "graft-intent"
version = "0.0.0-placeholder"
edition = "2021"
authors = ["Vesl Examples <examples@vesl.local>"]
description = "Family-5 intent-graft placeholder template — crashes on any %intent-* poke, pending canonical upstream"

[[bin]]
name = "graft-intent"
path = "src/main.rs"

[dependencies]
nockapp = { git = "https://github.com/nockchain/nockchain.git", rev = "dfc97ecc877687fc7ca972ebc71877df6e80d92b" }
nockvm = { git = "https://github.com/nockchain/nockchain.git", rev = "dfc97ecc877687fc7ca972ebc71877df6e80d92b" }
nockvm_macros = { git = "https://github.com/nockchain/nockchain.git", rev = "dfc97ecc877687fc7ca972ebc71877df6e80d92b" }

nock-noun-rs = { path = "../../crates/nock-noun-rs" }

tokio = { version = "1.32", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
sha2 = "0.10"

[patch.crates-io]
ibig = { path = "../../../nockchain/crates/nockvm/rust/ibig" }

[patch."https://github.com/nockchain/nockchain.git"]
nockapp         = { path = "../../../nockchain/crates/nockapp" }
nockvm          = { path = "../../../nockchain/crates/nockvm/rust/nockvm" }
nockvm_macros   = { path = "../../../nockchain/crates/nockvm/rust/nockvm_macros" }
ibig            = { path = "../../../nockchain/crates/nockvm/rust/ibig" }
nockchain-math  = { path = "../../../nockchain/crates/nockchain-math" }
nockchain-types = { path = "../../../nockchain/crates/nockchain-types" }
noun-serde      = { path = "../../../nockchain/crates/noun-serde" }
